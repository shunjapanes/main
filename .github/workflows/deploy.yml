name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 公開するのは GAS版と同じ1枚完結の index.html（HPチェックを外したもの）。
      # 旧URL（editor.html）で開いても同じ画面になるよう、同じファイルを2つの名前で置く。
      - name: Deploy to gh-pages
        run: |
          cp index.html /tmp/index.html
          cp client/public/sw.js /tmp/sw.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/index.html index.html
          cp /tmp/index.html editor.html
          cp /tmp/sw.js sw.js
          git add index.html editor.html sw.js
          git diff --staged --quiet || git commit -m "deploy: auto-build from main"
          git push origin gh-pages
